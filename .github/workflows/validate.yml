name: Validate

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hacs:
    name: HACS
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: HACS validation
        uses: hacs/action@1ebf01c408f29afcb6406bd431bc98fd8cbb15aa # main
        with:
          category: integration

  hassfest:
    name: Hassfest
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: home-assistant/actions/hassfest@86d4564712fa02543c808e3a693dd04f9d3f8361 # master

  tests:
    name: Tests (${{ matrix.ha }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        ha: [minimum, current]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
          cache: pip
      - name: Install hash-locked build tools
        run: >-
          python -m pip install --require-hashes --only-binary=:all:
          -r requirements-test-build.lock
      - name: Install hash-locked HA test environment
        # mock-open and pyric have no wheels. Only these hash-verified HA test
        # dependencies may build, using the locked tools above without downloads.
        run: >-
          python -m pip install --require-hashes --only-binary=:all:
          --no-binary=mock-open,pyric --no-build-isolation
          -r requirements-test-${{ matrix.ha }}.lock
      - run: python -m pip check
      - run: ruff check custom_components tests scripts
      - run: ruff format --check custom_components tests scripts
      - run: bandit -q -r custom_components/motorola_nursery scripts
      - run: coverage run -m pytest -q
        env:
          COVERAGE_FILE: .coverage.python
      - run: coverage report --fail-under=80
        env:
          COVERAGE_FILE: .coverage.python

      - name: Upload current HA coverage
        if: matrix.ha == 'current'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-python
          path: .coverage.python
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  sonar:
    name: SonarQube scan
    needs: tests
    # Fork PRs run tests without receiving the analysis credential.
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' &&
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - name: Download coverage data from this run
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: coverage-*
          path: coverage-data
          merge-multiple: true
      - name: Combine coverage and export XML
        run: |
          python -m pip install --only-binary=:all: 'coverage==7.16.2'
          python -m coverage combine coverage-data
          python -m coverage xml -o coverage.xml
      - name: Read integration version
        run: |
          python -c 'import json, os, re; from pathlib import Path; version = json.loads(Path("custom_components/motorola_nursery/manifest.json").read_text())["version"]; assert re.fullmatch(r"[0-9]+\.[0-9]+\.[0-9]+[A-Za-z0-9.+_-]*", version), "Invalid integration version"; print("SONAR_PROJECT_VERSION=" + version, file=open(os.environ["GITHUB_ENV"], "a"))'
      - name: Require analysis credential
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: test -n "$SONAR_TOKEN"
      - name: Analyze with SonarQube Cloud
        uses: SonarSource/sonarqube-scan-action@e805d875275f728fac1885b413934be6d7c63f65 # v8
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io
        with:
          args: >-
            -Dsonar.projectVersion=${{ env.SONAR_PROJECT_VERSION }}
            -Dsonar.qualitygate.wait=true
