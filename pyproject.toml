[tool.ruff]
target-version = "py313"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "ASYNC", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]

asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.coverage.run]
branch = true
relative_files = true
source = ["custom_components/motorola_nursery", "scripts"]
